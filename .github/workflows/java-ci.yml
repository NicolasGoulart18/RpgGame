name: Java CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: javac -encoding UTF-8 -d out $(find src tests -name '*.java')
      - name: Run tests
        run: java -cp out rpg.TestesRpg
