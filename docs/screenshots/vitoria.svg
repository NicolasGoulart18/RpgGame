<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="572" viewBox="0 0 1100 572" role="img" aria-label="RPG Game | Vitoria - saida real de console">
<rect width="1100" height="572" rx="18" fill="#101924"/>
<rect width="1100" height="56" rx="18" fill="#263446"/>
<rect y="45" width="1100" height="11" fill="#263446"/>
<circle cx="28" cy="27" r="8" fill="#ed6a5f"/><circle cx="54" cy="27" r="8" fill="#f5c451"/><circle cx="80" cy="27" r="8" fill="#66c37b"/>
<text x="117" y="33" fill="#e8f0f5" font-size="19" font-family="Consolas, Menlo, monospace">RPG Game | Vitoria - saida real de console</text>
<text x="24" y="92" fill="#92cafa" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">--- SEU TURNO ---</text>
<text x="24" y="121" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">Arthur (Guerreiro): 20/130 HP | Defesa: 15</text>
<text x="24" y="150" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">Dragao Anciao (Chefao): 10/160 HP</text>
<text x="24" y="179" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">1 - Ataque comum</text>
<text x="24" y="208" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">2 - Ataque especial (0 restantes)</text>
<text x="24" y="237" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">3 - Defender (metade do dano restante)</text>
<text x="24" y="266" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">4 - Usar pocao (5 restantes)</text>
<text x="24" y="295" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">5 - Equipar escudo (1 restantes)</text>
<text x="24" y="324" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">0 - Sair do jogo</text>
<text x="24" y="353" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">Sua escolha: 1</text>
<text x="24" y="382" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">Arthur usou ataque comum!</text>
<text x="24" y="411" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">Dragao Anciao (Chefao) recebeu 10 de dano. HP: 0</text>
<text x="24" y="440" fill="#88e5a5" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">VITORIA! Dragao Anciao (Chefao) foi derrotado.</text>
<text x="24" y="469" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve"></text>
<text x="24" y="498" fill="#88e5a5" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">*** PARABENS! VOCE SALVOU O REINO! ***</text>
<text x="24" y="527" fill="#e7eef2" font-size="19" font-family="Consolas, Menlo, monospace" xml:space="preserve">Aventura concluida com 20 HP restantes!</text>
</svg>
